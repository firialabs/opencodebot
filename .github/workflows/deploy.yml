# Publishes the built site to GitHub Pages at
# https://firialabs.github.io/opencodebot/
#
# Two conditions have to hold for this to run, and the job skips quietly
# (grey, not red) until they do:
#
#   1. The repository must be PUBLIC. GitHub Pages cannot publish from a
#      private repository except on GitHub Enterprise Cloud.
#   2. The push must be to the repository's default branch.
#
# Nothing else needs setting up by hand: `configure-pages` below turns Pages
# on by itself the first time it runs.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.repository.private == false &&
      github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Teachers will be pointed at this URL, so test the exact bundle we are
      # about to publish — including that it works from a sub-path and offline.
      - name: Test the build we are about to publish
        run: npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
