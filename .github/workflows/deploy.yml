# Publishes the built site to GitHub Pages at
# https://firialabs.github.io/opencodebot/
#
# The repository must be PUBLIC: GitHub Pages cannot publish from a private
# repository except on GitHub Enterprise Cloud. Until it is, the job skips
# quietly (grey, not red) rather than failing on every push.
#
# Nothing else needs setting up by hand — `configure-pages` below turns Pages
# on by itself the first time it runs.
#
# If the default branch is ever renamed, update the branch filter below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already running: a
# half-deployed Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Teachers will be pointed at this URL, so test the exact bundle we are
      # about to publish — including that it works from a sub-path and offline.
      - name: Test the build we are about to publish
        run: npm test

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
