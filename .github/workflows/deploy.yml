# Publishes the built site to GitHub Pages at
# https://firialabs.github.io/opencodebot/
#
# Two one-time prerequisites:
#
#   1. The repository must be PUBLIC. GitHub Pages cannot publish from a
#      private repository except on GitHub Enterprise Cloud. Until it is, the
#      job skips quietly (grey, not red) rather than failing on every push.
#   2. Pages must be switched on once, by hand, under
#      Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#      The workflow cannot do this for itself: creating a Pages site needs
#      admin access, and GITHUB_TOKEN only reaches write, so
#      `configure-pages` with `enablement: true` fails on an org repository
#      with "Resource not accessible by integration".
#
# If the default branch is ever renamed, update the branch filter below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already running: a
# half-deployed Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      # Teachers will be pointed at this URL, so test the exact bundle we are
      # about to publish — including that it works from a sub-path and offline.
      - name: Test the build we are about to publish
        run: npm test

      # Reads the Pages config; it cannot create it (see the note at the top).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
