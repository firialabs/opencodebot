name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm test
