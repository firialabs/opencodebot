name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The whole suite, the simulator's included, takes a few minutes; a hung
    # browser should not hold a runner for hours.
    timeout-minutes: 20
    # CodeAIR flight: the build fetches the flight library (sim/flight-library.json)
    # and the tests fly it.
    env:
      SIM_FLIGHT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the simulator's MicroPython needs JSPI, on by default from Node 24
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      - run: npm test

      # The budget for a school Chromebook (tests/perf.mjs). A report only: a
      # runner's speed is not a Chromebook's, and it varies from run to run.
      - name: Performance budget (report)
        run: npm run perf
        continue-on-error: true

      # What the simulator's UI test saw, to read a failure on the runner.
      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
