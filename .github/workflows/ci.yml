name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The whole suite, the simulator's included, takes a few minutes; a hung
    # browser should not hold a runner for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # the simulator's MicroPython needs JSPI, on by default from Node 24
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm test

      # What the simulator's UI test saw, to read a failure on the runner.
      - name: Keep the test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
