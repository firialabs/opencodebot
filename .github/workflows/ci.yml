name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to the default branch are covered by the deploy workflow, which runs
# this same suite against the bundle it is about to publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser the tests drive
        run: npx playwright install chromium

      # System libraries for that browser. The runner image already has
      # Chrome and its libraries, so this is a top-up: retry when the Ubuntu
      # mirror is flaky, and do not fail the build over it. If a library
      # really is missing, the tests themselves will say so.
      - name: Top up the browser's system libraries
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1

      - run: npm run build

      - run: npm test
