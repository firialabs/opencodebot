<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4EB748" />
    <!-- The title and description are repeated here, in English, for crawlers and link
         previews that do not run the page's script; src/i18n/en.js is their source. -->
    <meta name="description" content="Friendly block coding for Firia Labs CodeBot, CodeX, and CodeAIR."
          data-i18n-attr="content=app.description" />
    <link rel="icon" href="./icons/firia-bot-head.svg" type="image/svg+xml" />
    <title data-i18n="app.name">OpenCodeBot</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mascot" src="./icons/firia-bot.svg" alt="" width="27" height="48" />
          <div class="brand-text">
            <h1 class="brand-name" data-i18n="app.name"></h1>
            <span class="brand-tag" data-i18n="app.tagline"></span>
          </div>
        </div>

        <div class="project-bar">
          <button id="btn-new" class="btn btn-ghost btn-new" data-i18n-attr="title=btn.newTitle">
            <span class="btn-emoji" aria-hidden="true">🆕</span><span class="btn-text" data-i18n="btn.new"></span>
          </button>
          <input id="project-name" class="project-name" type="text" maxlength="60" spellcheck="false"
                 data-i18n-attr="aria-label=project.nameLabel;title=project.nameTitle;placeholder=project.default" />
        </div>

        <div class="topbar-center">
          <button id="device-chip" class="device-chip" aria-haspopup="listbox" aria-expanded="false">
            <span class="device-chip-dot" data-state="off"></span>
            <img class="device-chip-icon" id="device-chip-icon" src="./icons/dev-any.svg" alt="" width="22" height="22" />
            <span class="device-chip-label" id="device-chip-label" data-i18n="chip.pick"></span>
            <span class="device-chip-caret" aria-hidden="true">▾</span>
          </button>
          <div id="device-menu" class="device-menu" role="listbox" data-i18n-attr="aria-label=chip.menuHead" hidden></div>
        </div>

        <div class="topbar-actions">
          <button id="btn-connect" class="btn btn-connect">
            <span class="btn-emoji" aria-hidden="true">🔌</span><span class="btn-text" data-i18n="btn.connect"></span>
          </button>
          <button id="btn-sim" class="btn btn-sim" data-i18n-attr="title=btn.simulateTitle">
            <span class="btn-emoji" aria-hidden="true">🎮</span><span class="btn-text" data-i18n="btn.simulate"></span>
          </button>
          <button id="btn-run" class="btn btn-run" disabled>
            <span class="btn-emoji" aria-hidden="true">▶</span><span class="btn-text" data-i18n="btn.run"></span>
          </button>
          <button id="btn-stop" class="btn btn-stop" disabled>
            <span class="btn-emoji" aria-hidden="true">■</span><span class="btn-text" data-i18n="btn.stop"></span>
          </button>
          <div class="menu-wrap">
            <button id="btn-menu" class="btn btn-ghost" aria-haspopup="menu" aria-expanded="false" data-i18n-attr="title=btn.more;aria-label=btn.more">⋯</button>
            <div id="app-menu" class="app-menu" role="menu" hidden>
              <button role="menuitem" data-action="new" data-i18n="menu.new"></button>
              <button role="menuitem" data-action="examples" data-i18n="menu.examples"></button>
              <button role="menuitem" data-action="open" data-i18n="menu.open"></button>
              <button role="menuitem" data-action="save" data-i18n="menu.save"></button>
              <hr />
              <button role="menuitem" data-action="export-py" data-i18n="menu.exportPy"></button>
              <button role="menuitem" data-action="copy-py" data-i18n="menu.copyPy"></button>
              <hr />
              <button role="menuitem" data-action="help" data-i18n="menu.help"></button>
              <button role="menuitem" data-action="about" data-i18n="menu.about"></button>
              <hr />
              <div id="lang-menu" role="group" data-i18n-attr="aria-label=menu.language">
                <div class="menu-head" aria-hidden="true">🌐 <span data-i18n="menu.language"></span></div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="workarea">
        <section class="blocks-pane" id="blocks-pane">
          <div id="blockly-root" class="blockly-root"></div>
          <div class="text-mode-cover" id="text-mode-cover" hidden>
            <p class="text-mode-title" data-i18n="text.coverTitle"></p>
            <p data-i18n="text.coverBody"></p>
            <button id="btn-back-to-blocks" class="btn" type="button" data-i18n="text.toBlocks"></button>
          </div>
          <div class="blocks-hint" id="blocks-hint">
            <img src="./icons/firia-bot-head.svg" alt="" width="44" height="44" />
            <p data-i18n="blocks.hint"></p>
          </div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" aria-controls="side-pane" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
             data-i18n-attr="aria-label=splitter.label"></div>

        <section class="side-pane" id="side-pane">
          <div class="tabs">
            <div class="tablist" role="tablist" data-i18n-attr="aria-label=tab.listLabel">
              <button class="tab is-active" role="tab" id="tab-terminal" data-tab="terminal" aria-selected="true"
                      aria-controls="panel-terminal">
                <span aria-hidden="true">💬</span> <span data-i18n="tab.terminal"></span>
              </button>
              <button class="tab" role="tab" id="tab-sim" data-tab="sim" aria-selected="false"
                      aria-controls="panel-sim" tabindex="-1">
                <span aria-hidden="true">🎮</span> <span data-i18n="tab.sim"></span>
              </button>
              <button class="tab" role="tab" id="tab-python" data-tab="python" aria-selected="false"
                      aria-controls="panel-python" tabindex="-1">
                <span aria-hidden="true">🐍</span> <span data-i18n="tab.python"></span>
              </button>
            </div>
            <div class="tabs-spacer"></div>
            <button id="btn-clear-term" class="icon-btn" data-i18n-attr="title=term.clear;aria-label=term.clear">🧹</button>
          </div>

          <div class="tab-panel is-active" data-panel="terminal" id="panel-terminal" role="tabpanel" aria-labelledby="tab-terminal">
            <div id="terminal-host" class="terminal-host"></div>
            <div class="terminal-foot" id="terminal-foot">
              <span class="term-hint" data-i18n-html="term.hintHtml"></span>
            </div>
          </div>

          <div class="tab-panel" data-panel="sim" id="panel-sim" role="tabpanel" aria-labelledby="tab-sim">
            <div id="sim-host" class="sim-host"></div>
          </div>

          <div class="tab-panel" data-panel="python" id="panel-python" role="tabpanel" aria-labelledby="tab-python">
            <div class="python-bar">
              <span class="python-bar-msg" id="python-bar-msg" data-i18n="text.barBlocks"></span>
              <button id="btn-mode" class="btn btn-small" type="button" data-i18n="text.toText"></button>
            </div>
            <pre id="python-view" class="python-view"><code>&nbsp;</code></pre>
            <textarea id="python-editor" class="python-view python-editor" spellcheck="false" autocapitalize="off"
                      autocomplete="off" data-i18n-attr="aria-label=text.editorLabel" aria-describedby="python-editor-help" hidden></textarea>
            <p id="python-editor-help" class="sr-only" data-i18n="text.editorHelp"></p>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="status-chip" id="status-chip" data-state="idle" data-i18n="status.offline"></span>
        <span class="status-msg" id="status-msg" role="status" data-i18n="status.start"></span>
        <span class="status-spacer"></span>
        <span class="status-note" id="browser-note"></span>
      </footer>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <dialog id="modal" class="modal"></dialog>
    <input type="file" id="file-input" accept=".ocb,.json" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
